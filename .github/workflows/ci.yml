name: CI

on:
    pull_request: ~
    push:
        branches:
            - '*'
        tags:
            - '*'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: composer update --working-dir=tools/ecs --no-interaction --no-progress

            -   name: Check the coding style
                run: composer cs-check

    tests:
        name: PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ' --prefer-lowest' || '' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.1, 8.2, 8.3, 8.4, 8.5 ]
                dependencies: [ highest ]
                include:
                    -   php: 8.1
                        dependencies: lowest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install the dependencies
                run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

            -   name: Run the unit tests
                run: composer unit-tests

    contao6:
        name: Contao 6 readiness (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        # The MultiColumnWizard does not support Contao 6 yet, so this job installs
        # Contao 6 without it and runs the unit tests against the Contao 6 API.
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.4 ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install Contao 6 without the MultiColumnWizard
                run: |
                    composer remove menatwork/contao-multicolumnwizard-bundle --no-update
                    composer require contao/core-bundle:^6.0 --no-update
                    composer update --no-interaction --no-progress

            -   name: Run the unit tests
                run: composer unit-tests
